version: "3.8"

services:
  database:
    container_name: litres_database
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      - ACCEPT_EULA=Y
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - SA_USER=${SA_USER}
      - SA_PASSWORD=${SA_PASSWORD}
      - HANGFIRE_PASSWORD=${HANGFIRE_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - ./database/init-db.sh:/usr/src/app/init-db.sh
      - ./database/create-databases.sql:/usr/src/app/create-databases.sql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "${SA_USER}", "-P", "${SA_PASSWORD}", "-d", "${DB_NAME}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      
  postgres:
    container_name: litres_payment_db
    image: postgres:15
    environment:
      - POSTGRES_USER=${PAYMENT_DB_USER}
      - POSTGRES_PASSWORD=${PAYMENT_DB_PASSWORD}
      - POSTGRES_DB=${PAYMENT_DB}   
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    container_name: litres_migrate
    build:
      context: ./backend
      dockerfile: ./Litres.Infrastructure/Dockerfile
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - SA_USER=${SA_USER}
      - SA_PASSWORD=${SA_PASSWORD}
      - HANGFIRE_PASSWORD=${HANGFIRE_PASSWORD}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - HANGFIRE_CONNECTION_STRING=${HANGFIRE_CONNECTION_STRING}
      - TEST_DB_CONNECTION_STRING=${TEST_DB_CONNECTION_STRING}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL}
    depends_on:
      database:
        condition: service_healthy    

  payment:
    container_name: litres_payment
    build:
      context: ./backend/Litres.Payment
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  server:
    container_name: litres_server
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - SA_USER=${SA_USER}
      - SA_PASSWORD=${SA_PASSWORD}
      - HANGFIRE_PASSWORD=${HANGFIRE_PASSWORD}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - HANGFIRE_CONNECTION_STRING=${HANGFIRE_CONNECTION_STRING}
      - TEST_DB_CONNECTION_STRING=${TEST_DB_CONNECTION_STRING}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL}
    ports:
      - "5271:8080"
    depends_on:
      - migrate
    restart: "no"

  frontend:
    container_name: litres_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:8081"
    depends_on:
      - server
        
volumes:
  postgres_data: